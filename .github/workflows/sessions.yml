name: "Current Home Assistant session tests"

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4.1.1
      - name: "Python 3.14"
        uses: actions/setup-python@v5.0.0
        with:
          python-version: "3.14"
      - name: "Install current HA and test dependencies"
        run: >-
          python -m pip install
          'homeassistant==2026.10.1'
          'ph4-walkingpad>=1.0.2'
          'garmin-fit-sdk==21.221.0'
          'voluptuous>=0.13.1'
          'ruff==0.2.2'
          PyYAML
      - name: "Lint"
        run: python -m ruff check .
      - name: "Run recorder, FIT, real HA and blueprint tests"
        run: python -m unittest discover -s tests -v
