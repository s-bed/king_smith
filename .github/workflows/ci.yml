name: "CI"

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "Lint and tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - name: "Python 3.14"
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: "Node.js 24"
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Keep the known-good HA environment; requirements.txt targets legacy HA.
      - name: "Install HA and test dependencies"
        run: >-
          python -m pip install
          'homeassistant==2026.10.1'
          'home-assistant-frontend==20260930.3'
          'ph4-walkingpad>=1.0.2'
          'garmin-fit-sdk==21.221.0'
          'voluptuous>=0.13.1'
          'ruff==0.2.2'
          PyYAML
      - name: "Lint"
        run: python -m ruff check .
      - name: "Run recorder, FIT, real HA and blueprint tests"
        run: python -m unittest discover -s tests -v
      - name: "Test native session panel"
        run: node --test tests/test_panel_frontend.cjs
